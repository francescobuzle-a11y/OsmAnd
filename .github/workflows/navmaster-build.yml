name: NavMaster - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout fork (NavMaster)
      uses: actions/checkout@v4
      with:
        path: android
    - name: Checkout OsmAnd-resources
      uses: actions/checkout@v4
      with:
        repository: osmandapp/OsmAnd-resources
        path: resources

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

    - name: Gradle memory
      working-directory: ./android
      run: printf "\norg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\n" >> gradle.properties

    - name: Build (nightlyFree, legacy, arm64, debug)
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleNightlyFreeLegacyArm64Debug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: navmaster-apk
        path: android/OsmAnd/build/outputs/apk/**/*.apk
        retention-days: 30
