name: NavMaster - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout fork (NavMaster)
      uses: actions/checkout@v5
      with:
        path: android
    - name: Checkout OsmAnd-resources
      uses: actions/checkout@v5
      with:
        repository: osmandapp/OsmAnd-resources
        path: resources

    - name: Apply NavMaster customizations
      run: bash android/navmaster/apply.sh

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

    - name: Gradle memory
      working-directory: ./android
      run: printf "\norg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\n" >> gradle.properties

    - name: Build (nightlyFree, legacy, arm32+arm64, debug)
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleNightlyFreeLegacyArmonlyDebug -x test

    - name: Prepare APK
      run: |
        mkdir -p out
        f=$(find android/OsmAnd/build/outputs/apk -name '*.apk' | head -1)
        cp "$f" out/NavMaster-${{ github.run_number }}.apk
        ls -la out

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: navmaster-apk
        path: out/*.apk
        retention-days: 30

    - name: Publish release (direct .apk download)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: NavMaster build ${{ github.run_number }}
        files: out/*.apk
        make_latest: true
