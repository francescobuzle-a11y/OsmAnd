name: NavMaster - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: navmaster-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    # Always build on the latest official OsmAnd (matches the prebuilt OpenGL core),
    # then apply the NavMaster customizations kept in this repository (navmaster/).
    - name: Checkout latest OsmAnd
      uses: actions/checkout@v5
      with:
        repository: osmandapp/OsmAnd
        path: android
    - name: Checkout NavMaster files
      uses: actions/checkout@v5
      with:
        path: fork
        sparse-checkout: navmaster
    - name: Checkout OsmAnd-resources
      uses: actions/checkout@v5
      with:
        repository: osmandapp/OsmAnd-resources
        path: resources

    - name: Apply NavMaster customizations
      run: |
        cp -r fork/navmaster android/navmaster
        bash android/navmaster/apply.sh

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

    - name: Gradle memory
      working-directory: ./android
      run: printf "\norg.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8\n" >> gradle.properties

    - name: Build release (OpenGL, ARM for devices + x86 for the emulator preview)
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleNightlyFreeOpenglArmonlyRelease assembleNightlyFreeOpenglX86Release -x test

    - name: Prepare APK
      run: |
        mkdir -p out
        find android/OsmAnd/build/outputs/apk -name '*.apk' -exec ls -la {} \;
        arm=$(find android/OsmAnd/build/outputs/apk -path '*Armonly*' -name '*.apk' -o -path '*armonly*' -name '*.apk' | head -1)
        x86=$(find android/OsmAnd/build/outputs/apk -path '*X86*' -name '*.apk' -o -path '*x86*' -name '*.apk' | head -1)
        cp "$arm" out/NavMaster-${{ github.run_number }}.apk
        cp "$x86" preview-x86.apk
        ls -la out preview-x86.apk

    - name: Enable KVM (emulator)
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Preview on Android emulator (screenshots)
      continue-on-error: true
      timeout-minutes: 25
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: google_apis
        arch: x86_64
        profile: pixel_4
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: bash android/navmaster/preview.sh preview-x86.apk shots

    - name: Publish release (direct .apk download)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: NavMaster build ${{ github.run_number }}
        files: |
          out/*.apk
          shots/*.png
          shots/*.txt
        make_latest: true
